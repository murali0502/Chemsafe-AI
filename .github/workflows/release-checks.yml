name: Chemsafe release checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt
          npm ci
          npx playwright install --with-deps chromium
      - name: Build and check manufacturer links
        run: |
          python prepare_data.py
          python train_model.py
          python build_netlify.py
          python scripts/check_sds_links.py
      - name: Test dashboard and PDF
        run: |
          python -m http.server 8514 --bind 127.0.0.1 --directory netlify-dist &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          curl --fail --retry 5 --retry-connrefused --retry-delay 1 http://127.0.0.1:8514/ -o /dev/null
          node scripts/smoke.cjs
      - name: Trigger Netlify build
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          NETLIFY_BUILD_HOOK: ${{ secrets.NETLIFY_BUILD_HOOK }}
        run: |
          if [ -n "$NETLIFY_BUILD_HOOK" ]; then
            curl --fail --silent --show-error --max-time 30 -X POST "$NETLIFY_BUILD_HOOK"
          fi
